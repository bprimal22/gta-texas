<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Explore Austin from campus to the river. Walk, ride a scooter, or take flight in GTA Texas." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>GTA Texas · Explore Austin</title>
    <style>
      html,body{margin:0;background:#121a18;color:#f4efdf;font-family:Arial,Helvetica,sans-serif}
      .startup-shell{position:fixed;inset:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 70% 0%,#344236 0%,#121a18 70%)}
      .startup-content{width:min(100%,640px)}
      .startup-kicker{font-size:11px;letter-spacing:.24em;color:#cdbba0}
      .startup-title{margin:20px 0 36px;font-weight:900;font-size:clamp(52px,12vw,100px);letter-spacing:-.07em;line-height:.9}
      .startup-title span{display:block;color:#e98543}
      .startup-status{font-size:14px;line-height:1.6;color:#d1d6cc;max-width:400px}
      .startup-retry{margin-top:18px;border:0;border-radius:4px;padding:14px 24px;background:#e98543;color:#121a18;font:700 14px Arial;cursor:pointer}
      .startup-retry:focus-visible{outline:3px solid #f4efdf;outline-offset:4px}
    </style>
  </head>
  <body class="antialiased">
    <div id="root"><main class="startup-shell"><div class="startup-content"><p class="startup-kicker">AUSTIN · TEXAS</p><h1 class="startup-title">GTA <span>TEXAS</span></h1><p class="startup-status" role="status">Starting the game…</p><noscript><p class="startup-status">Enable JavaScript to play GTA Texas.</p></noscript></div></main></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
